theme = "cdwilson-tomorrow-night"
theme-dark = "cdwilson-tomorrow-night"

open-with-app = "VS Code|com.microsoft.VSCode"

foreground = "#c5c8c6"
background = "#1d1f21"
palette-0 = "#282a2e"
palette-1 = "#cc6666"
palette-2 = "#b5bd68"
palette-3 = "#f0c674"
palette-4 = "#81a2be"
palette-5 = "#b294bb"
palette-6 = "#8abeb7"
palette-7 = "#c5c8c6"
palette-8 = "#373b41"
palette-9 = "#cc6666"
palette-10 = "#b5bd68"
palette-11 = "#de935f"
palette-12 = "#81a2be"
palette-13 = "#b294bb"
palette-14 = "#8abeb7"
palette-15 = "#e0e0e0"
selection-foreground = "#c5c8c6"
selection-background = "#373b41"
cursor-color = "#de935f"
cursor-text = "#1d1f21"

font-family = "Monaspace Neon"
font-size = 14
adjust-cell-height = "20%"
text-blink = true
cursor-style = "bar"

privilege-sound-shell = false

on-launch = "new_window"
