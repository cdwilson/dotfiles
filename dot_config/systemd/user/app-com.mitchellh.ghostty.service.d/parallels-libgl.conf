# Drop-in for the user-scoped Ghostty service on ARM64 Ubuntu under Parallels.
# The desktop entry sets DBusActivatable=true, so launching Ghostty from the
# app menu activates this systemd unit rather than running Exec= directly.
# Force Mesa's software renderer here so the GUI launch path matches the CLI
# wrapper at ~/.local/bin/ghostty. Deployed only when chezmoi detects
# linux/arm64 + Parallels (see .chezmoiignore).

[Service]
Environment=LIBGL_ALWAYS_SOFTWARE=true
